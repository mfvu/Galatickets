<!DOCTYPE html>
<html lang="nl">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>MFVU Ticket Scanner</title>


<!-- QR scanner library -->
<script
  src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js">
</script>


<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #111;
  color: white;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;
}

.container {
  width: 100%;
  max-width: 600px;
  margin: auto;
  padding: 20px;
}

.header {
  text-align: center;
  margin-bottom: 20px;
}

.header h1 {
  margin: 5px 0;
  font-size: 28px;
}

.header p {
  color: #aaa;
  margin: 5px 0;
}


/* PAGINA'S */

.page {
  display: none;
}

.page.active {
  display: block;
}


/* CAMERA CHECK */

.camera-check {
  background: #222;
  padding: 30px 20px;
  border-radius: 18px;
  text-align: center;
}

.camera-icon {
  font-size: 65px;
  margin-bottom: 15px;
}

.camera-check h2 {
  margin-top: 0;
}

.camera-check p {
  color: #bbb;
  line-height: 1.5;
}

button {
  width: 100%;
  padding: 17px;
  margin-top: 15px;
  border: none;
  border-radius: 12px;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
}

.primary-button {
  background: white;
  color: #111;
}

.secondary-button {
  background: #333;
  color: white;
}

button:disabled {
  opacity: 0.5;
}


/* CAMERA PREVIEW */

#cameraPreview {
  display: none;
  width: 100%;
  margin-top: 20px;
  border-radius: 15px;
  background: black;
}


/* CAMERA STATUS */

.camera-status {
  margin-top: 20px;
  padding: 15px;
  border-radius: 12px;
  background: #333;
  line-height: 1.5;
}

.camera-status.success {
  background: #075c2b;
}

.camera-status.error {
  background: #7d1724;
}


/* SCANNER */

#reader {
  width: 100%;
  overflow: hidden;
  border-radius: 18px;
  background: black;
}

#reader video {
  width: 100% !important;
  border-radius: 18px;
}


/* SCANNER STATUS */

.scanner-status {
  text-align: center;
  margin-top: 15px;
  color: #aaa;
}


/* RESULTAAT */

.result {
  display: none;
  margin-top: 20px;
  padding: 30px 20px;
  border-radius: 18px;
  text-align: center;
}

.result.valid {
  display: block;
  background: #075c2b;
}

.result.already-used {
  display: block;
  background: #9a6700;
}

.result.invalid {
  display: block;
  background: #8a1826;
}

.result.error {
  display: block;
  background: #555;
}

.result-icon {
  font-size: 65px;
}

.result-title {
  font-size: 28px;
  font-weight: 800;
  margin-top: 10px;
}

.result-ticket {
  font-size: 21px;
  font-weight: bold;
  margin-top: 15px;
}

.result-name {
  font-size: 19px;
  margin-top: 5px;
}


/* HANDMATIG */

.manual {
  margin-top: 20px;
  padding: 18px;
  background: #222;
  border-radius: 15px;
}

.manual-title {
  font-weight: bold;
}

.manual input {
  width: 100%;
  padding: 14px;
  margin-top: 10px;
  border: none;
  border-radius: 10px;
  font-size: 18px;
}


/* LOADING */

.loading {
  display: none;
  text-align: center;
  margin-top: 20px;
  color: #aaa;
}

</style>

</head>


<body>


<div class="container">


<!-- =================================================
     CAMERA CHECK
     ================================================= -->

<div
  id="cameraPage"
  class="page active"
>

  <div class="header">

    <h1>
      🎟 MFVU Ticket Scanner
    </h1>

    <p>
      Camera controleren
    </p>

  </div>


  <div class="camera-check">


    <div class="camera-icon">
      📷
    </div>


    <h2>
      Camera testen
    </h2>


    <p>

      Test eerst de camera voordat je
      tickets gaat scannen.

    </p>


    <button
      id="cameraButton"
      class="primary-button"
      onclick="testCamera()"
    >

      📷 Camera testen

    </button>


    <video
      id="cameraPreview"
      autoplay
      playsinline
      muted
    ></video>


    <div
      id="cameraStatus"
      class="camera-status"
    >

      Camera nog niet getest.

    </div>


    <button
      id="continueButton"
      class="primary-button"
      style="display:none;"
      onclick="openScanner()"
    >

      ✅ Start ticketscanner

    </button>


  </div>

</div>



<!-- =================================================
     SCANNER
     ================================================= -->

<div
  id="scannerPage"
  class="page"
>

  <div class="header">

    <h1>
      🎟 MFVU Ticket Scanner
    </h1>

    <p>
      Scan een ticket
    </p>

  </div>


  <div id="reader"></div>


  <div
    id="scannerStatus"
    class="scanner-status"
  >

    Scanner wordt gestart...

  </div>


  <!-- RESULTAAT -->

  <div
    id="result"
    class="result"
  >

    <div
      id="resultIcon"
      class="result-icon"
    ></div>

    <div
      id="resultTitle"
      class="result-title"
    ></div>

    <div
      id="resultTicket"
      class="result-ticket"
    ></div>

    <div
      id="resultName"
      class="result-name"
    ></div>

  </div>


  <button
    id="scanAgainButton"
    class="primary-button"
    style="display:none;"
    onclick="scanAgain()"
  >

    📷 Volgend ticket scannen

  </button>


  <div class="manual">

    <div class="manual-title">
      QR-code werkt niet?
    </div>


    <input
      id="manualTicket"
      type="text"
      placeholder="Ticketnummer"
    >


    <button
      class="secondary-button"
      onclick="manualCheck()"
    >

      Controleer ticket

    </button>

  </div>


  <div
    id="loading"
    class="loading"
  >

    ⏳ Ticket wordt gecontroleerd...

  </div>

</div>


</div>



<script>


/* =====================================================
   INSTELLINGEN
   ===================================================== */

const API_URL =
  'https://script.google.com/macros/s/AKfycbyX36SNH_aBF6IyVeQz4BTJQWhuhuh3NsHcPo1uPpcKUgeaXIX8L6yE-ajI9B29CpI/exec';


/* =====================================================
   VARIABELEN
   ===================================================== */

let cameraStream = null;

let scanner = null;

let processing = false;

let scannerStarted = false;


/* =====================================================
   CAMERA TEST
   ===================================================== */

async function testCamera() {


  const button =
    document.getElementById(
      'cameraButton'
    );

  const status =
    document.getElementById(
      'cameraStatus'
    );

  const preview =
    document.getElementById(
      'cameraPreview'
    );

  const continueButton =
    document.getElementById(
      'continueButton'
    );


  button.disabled = true;

  status.className =
    'camera-status';

  status.textContent =
    '📷 Camera wordt gestart...';


  try {


    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      throw new Error(
        'Camera API wordt niet ondersteund.'
      );

    }


    /*
     * Camera openen.
     */

    cameraStream =
      await navigator.mediaDevices.getUserMedia({

        video: {

          facingMode: {
            ideal: 'environment'
          }

        },

        audio: false

      });


    /*
     * Preview tonen.
     */

    preview.srcObject =
      cameraStream;

    preview.style.display =
      'block';


    /*
     * Camera is goed.
     */

    status.className =
      'camera-status success';

    status.innerHTML =
      '✅ <strong>Camera werkt!</strong><br>' +
      'De scanner kan nu worden gestart.';


    button.textContent =
      '✅ Camera werkt';


    continueButton.style.display =
      'block';


  }

  catch (error) {

    console.error(error);

    button.disabled =
      false;


    status.className =
      'camera-status error';


    status.innerHTML =
      '❌ Camera kon niet worden geopend.<br><br>' +
      '<small>' +
      error.name +
      '</small>';

  }

}



/* =====================================================
   NA CAMERA CHECK
   ===================================================== */

async function openScanner() {


  /*
   * Camera-checkpagina verbergen.
   */

  document
    .getElementById(
      'cameraPage'
    )
    .classList
    .remove('active');


  /*
   * Scannerpagina tonen.
   */

  document
    .getElementById(
      'scannerPage'
    )
    .classList
    .add('active');


  /*
   * BELANGRIJK:
   *
   * We stoppen de camera hier niet eerst
   * en proberen hem daarna opnieuw te openen.
   *
   * Eerst proberen we de QR scanner te starten.
   */


  await startQRScanner();

}



/* =====================================================
   QR SCANNER
   ===================================================== */

async function startQRScanner() {


  processing =
    false;


  const status =
    document.getElementById(
      'scannerStatus'
    );


  status.textContent =
    'Scanner wordt gestart...';


  /*
   * Maak scanner-object.
   */

  scanner =
    new Html5Qrcode(
      'reader'
    );


  try {


    /*
     * html5-qrcode krijgt de camera.
     */

    await scanner.start(

      {
        facingMode:
          'environment'
      },


      {

        fps: 10,

        qrbox: {

          width: 250,

          height: 250

        },

        aspectRatio: 1.0

      },


      /*
       * QR gevonden.
       */

      function(decodedText) {

        onQRCode(
          decodedText
        );

      },


      /*
       * Geen QR gevonden.
       */

      function(errorMessage) {}

    );


    scannerStarted =
      true;


    /*
     * Onze tijdelijke camerastream
     * niet meer nodig.
     *
     * html5-qrcode heeft nu zelf
     * controle over de camera.
     */

    if (cameraStream) {

      cameraStream
        .getTracks()
        .forEach(
          track =>
            track.stop()
        );

      cameraStream =
        null;

    }


    /*
     * Preview verbergen.
     */

    document
      .getElementById(
        'cameraPreview'
      )
      .style.display =
      'none';


    status.textContent =
      'Scanner actief — houd een QR-code voor de camera.';


  }

  catch (error) {


    console.error(
      'Scanner error:',
      error
    );


    status.innerHTML =
      '❌ <strong>Scanner kan niet worden gestart.</strong><br><br>' +
      '<small>' +
      error.name +
      '<br>' +
      error.message +
      '</small>';

  }

}



/* =====================================================
   QR CODE GEVONDEN
   ===================================================== */

async function onQRCode(
  decodedText
) {


  /*
   * Voorkom meerdere scans
   * van dezelfde QR.
   */

  if (processing) {

    return;

  }


  processing =
    true;


  const ticketNumber =
    decodedText.trim();


  /*
   * Scanner stoppen.
   */

  if (
    scanner &&
    scannerStarted
  ) {

    try {

      await scanner.stop();

    }

    catch (error) {}

    scannerStarted =
      false;

  }


  /*
   * Ticket controleren.
   */

  checkTicket(
    ticketNumber
  );

}



/* =====================================================
   TICKET CONTROLEREN
   ===================================================== */

function checkTicket(
  ticketNumber
) {


  showLoading(
    true
  );


  /*
   * Unieke JSONP callback.
   */

  const callbackName =
    'ticketCallback_' +
    Date.now() +
    '_' +
    Math.random()
      .toString(36)
      .substring(2);


  /*
   * Script-element.
   */

  const script =
    document.createElement(
      'script'
    );


  /*
   * Callback.
   */

  window[callbackName] =
    function(data) {


      showLoading(
        false
      );


      if (
        script.parentNode
      ) {

        script.parentNode
          .removeChild(
            script
          );

      }


      try {

        delete window[
          callbackName
        ];

      }

      catch (error) {}


      handleResult(
        data
      );

    };


  /*
   * URL.
   */

  script.src =
    API_URL +
    '?ticket=' +
    encodeURIComponent(
      ticketNumber
    ) +
    '&callback=' +
    encodeURIComponent(
      callbackName
    );


  script.async =
    true;


  /*
   * Verbinding mislukt.
   */

  script.onerror =
    function() {


      showLoading(
        false
      );


      try {

        delete window[
          callbackName
        ];

      }

      catch (error) {}


      showResult(

        'error',

        ticketNumber,

        '',

        'Kan geen verbinding maken met het ticketsysteem.'

      );

    };


  document
    .body
    .appendChild(
      script
    );

}



/* =====================================================
   RESULTAAT
   ===================================================== */

function handleResult(
  result
) {


  if (!result) {

    showResult(
      'error',
      '',
      '',
      'Geen geldig antwoord ontvangen.'
    );

    return;

  }


  if (
    result.status ===
    'valid'
  ) {

    showResult(

      'valid',

      result.ticketNumber,

      result.name,

      'TICKET GELDIG!'

    );


    vibrate(
      [200]
    );

    return;

  }


  if (
    result.status ===
    'already_used'
  ) {

    showResult(

      'already-used',

      result.ticketNumber,

      result.name,

      'TICKET AL GEBRUIKT!'

    );


    vibrate(
      [150, 100, 150]
    );

    return;

  }


  if (
    result.status ===
    'not_found'
  ) {

    showResult(

      'invalid',

      result.ticketNumber,

      '',

      'ONGELDIG TICKET!'

    );


    vibrate(
      [400]
    );

    return;

  }


  showResult(

    'error',

    result.ticketNumber || '',

    result.name || '',

    result.message ||
      'Er is iets misgegaan.'

  );

}



/* =====================================================
   RESULTAAT TONEN
   ===================================================== */

function showResult(
  type,
  ticket,
  name,
  message
) {


  const result =
    document.getElementById(
      'result'
    );

  const icon =
    document.getElementById(
      'resultIcon'
    );

  const title =
    document.getElementById(
      'resultTitle'
    );

  const ticketElement =
    document.getElementById(
      'resultTicket'
    );

  const nameElement =
    document.getElementById(
      'resultName'
    );

  const scanAgain =
    document.getElementById(
      'scanAgainButton'
    );


  result.className =
    'result ' +
    type;


  result.style.display =
    'block';


  if (
    type ===
    'valid'
  ) {

    icon.textContent =
      '✅';

  }

  else if (
    type ===
    'already-used'
  ) {

    icon.textContent =
      '⚠️';

  }

  else if (
    type ===
    'invalid'
  ) {

    icon.textContent =
      '❌';

  }

  else {

    icon.textContent =
      '⚠️';

  }


  title.textContent =
    message;


  ticketElement.textContent =
    ticket
      ? 'Ticket: ' + ticket
      : '';


  nameElement.textContent =
    name || '';


  scanAgain.style.display =
    'block';

}



/* =====================================================
   VOLGENDE SCAN
   ===================================================== */

async function scanAgain() {


  document
    .getElementById(
      'result'
    )
    .style.display =
    'none';


  document
    .getElementById(
      'scanAgainButton'
    )
    .style.display =
    'none';


  document
    .getElementById(
      'scannerStatus'
    )
    .textContent =
    'Scanner wordt gestart...';


  processing =
    false;


  await startQRScanner();

}



/* =====================================================
   HANDMATIGE INVOER
   ===================================================== */

function manualCheck() {


  const input =
    document.getElementById(
      'manualTicket'
    );


  const ticket =
    input.value.trim();


  if (!ticket) {

    return;

  }


  if (
    scanner &&
    scannerStarted
  ) {

    scanner
      .stop()
      .catch(
        function() {}
      );

    scannerStarted =
      false;

  }


  processing =
    true;


  input.value =
    '';


  checkTicket(
    ticket
  );

}



/* =====================================================
   LOADING
   ===================================================== */

function showLoading(
  visible
) {

  document
    .getElementById(
      'loading'
    )
    .style.display =
    visible
      ? 'block'
      : 'none';

}



/* =====================================================
   VIBRATIE
   ===================================================== */

function vibrate(
  pattern
) {

  if (
    navigator.vibrate
  ) {

    navigator.vibrate(
      pattern
    );

  }

}

</script>

</body>

</html>
