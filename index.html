<!DOCTYPE html>
<html lang="nl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Camera Test</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #111;
      color: white;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 500px;
      padding: 25px;
      text-align: center;
    }

    h1 {
      font-size: 30px;
      margin-bottom: 10px;
    }

    p {
      color: #aaa;
      line-height: 1.5;
    }

    button {
      width: 100%;
      padding: 18px;
      margin-top: 20px;

      border: none;
      border-radius: 12px;

      background: white;
      color: #111;

      font-size: 19px;
      font-weight: bold;
    }

    video {
      display: none;

      width: 100%;
      margin-top: 25px;

      border-radius: 18px;
      background: black;
    }

    #status {
      margin-top: 20px;
      padding: 15px;
      border-radius: 12px;
      background: #222;
      line-height: 1.5;
    }

    .success {
      background: #075c2b !important;
    }

    .error {
      background: #7d1724 !important;
    }

  </style>

</head>


<body>

  <div class="container">

    <h1>📷 Camera Test</h1>

    <p>
      Deze pagina test alleen of je telefoon
      toegang kan krijgen tot de camera.
    </p>

    <button id="startButton">
      📷 Camera starten
    </button>

    <video
      id="video"
      autoplay
      playsinline
      muted>
    </video>

    <div id="status">
      Nog niet getest.
    </div>

  </div>


<script>

const button =
  document.getElementById("startButton");

const video =
  document.getElementById("video");

const status =
  document.getElementById("status");


button.addEventListener(
  "click",
  startCamera
);


async function startCamera() {

  status.className = "";

  status.textContent =
    "Camera wordt gestart...";


  /*
   * Eerst controleren of de browser
   * camera-toegang ondersteunt.
   */

  if (
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ) {

    status.className = "error";

    status.textContent =
      "❌ Deze browser ondersteunt geen camera-toegang via deze pagina.";

    return;
  }


  try {

    /*
     * Camera openen.
     *
     * Dit hoort op iPhone Safari
     * de cameramelding te veroorzaken.
     */

    const stream =
      await navigator.mediaDevices.getUserMedia({

        video: {
          facingMode: {
            ideal: "environment"
          }
        },

        audio: false

      });


    /*
     * Camerastream aan video koppelen.
     */

    video.srcObject =
      stream;

    video.style.display =
      "block";


    status.className =
      "success";

    status.innerHTML =
      "✅ <strong>Camera werkt!</strong><br><br>" +
      "De camera is succesvol geopend.";


    button.textContent =
      "✅ Camera werkt";


    button.disabled =
      true;

  }

  catch (error) {

    console.error(error);


    status.className =
      "error";


    let message =
      "❌ Camera kon niet worden geopend.";


    if (
      error.name ===
      "NotAllowedError"
    ) {

      message =
        "❌ Cameratoegang is geweigerd.<br><br>" +
        "Controleer de camera-instellingen van Safari.";

    }


    else if (
      error.name ===
      "NotFoundError"
    ) {

      message =
        "❌ Er is geen camera gevonden.";

    }


    else if (
      error.name ===
      "NotReadableError"
    ) {

      message =
        "❌ De camera is momenteel in gebruik door een andere app.";

    }


    else if (
      error.name ===
      "SecurityError"
    ) {

      message =
        "❌ De browser blokkeert toegang tot de camera.";

    }


    else if (
      error.name ===
      "TypeError"
    ) {

      message =
        "❌ De pagina wordt niet in een beveiligde HTTPS-omgeving geopend.";

    }


    status.innerHTML =
      message +
      "<br><br>" +
      "<small>Technische fout: " +
      error.name +
      "</small>";

  }

}

</script>

</body>

</html>
